# Glimpse 在 pages.yanlei.org 上用到的 nginx（OpenResty）配置，取自服务器上的
# conf.d/pages.yanlei.org.conf，供参考和重建服务器用。令牌不在这里：
#   glimpse-deploy-token.inc  proxy_set_header Deploy-Token "<部署令牌，read_package_registry>";
#   glimpse-api-token.inc     proxy_set_header PRIVATE-TOKEN "<项目访问令牌，Reporter，read_api>";
# 另需：nginx.conf 的 http{} 里 lua_shared_dict glimpse 1m; 以及 lua/glimpse_releases.lua。
# 项目 kaguya/glimpse 的 ID 是 150；GitLab 容器在 docker 网络里叫 gitlab。

# --- http{} 级（server 外）---
# /glimpse-downloads/ 的缓存策略：成功的包长期缓存，其余（404、401、5xx）一律不缓存。
map $status $glimpse_download_cache {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    default "no-store";
}

# --- pages.yanlei.org 的 443 server{} 里，location / 之前 ---
    # Glimpse 下载镜像：静态文件，不经过 GitLab。目录结构是 <官方域名>/<路径>，
    # 由 Glimpse 源码里的 tools/mirror-downloads.py 填充（宿主机 data/srv/www/glimpse-mirror）。
    # 文件缺失时返回 404，Glimpse 会自动改用官方地址。
    location /glimpse-mirror/ {
        alias /srv/www/glimpse-mirror/;
        autoindex off;
    }

    # Glimpse 版本信息：实时取自 GitLab（lua/glimpse_releases.lua），代替 Pages 里部署时的文件。
    location = /kaguya/glimpse/releases.json {
        content_by_lua_block { require("glimpse_releases").releases() }
    }
    location = /kaguya/glimpse/update.json {
        # 必须更新的版本：设置为"自动进行必须的更新"的 Glimpse，低于这个版本时会自动
        # 更新到它。留空表示没有。改完重载 nginx，最多 60 秒生效。
        set $glimpse_required_version "";
        content_by_lua_block { require("glimpse_releases").update() }
    }
    # 上面两个用的 GitLab API（项目 150），只供 Lua 内部调用。
    # 令牌在 glimpse-api-token.inc：项目访问令牌，角色 Reporter，权限只勾 read_api。
    location /__glimpse_api/ {
        internal;
        rewrite ^/__glimpse_api/(.*)$ /api/v4/projects/150/$1 break;
        include /etc/nginx/conf.d/glimpse-api-token.inc;
        proxy_set_header Host git.yanlei.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        # 子请求的回应要原样给 Lua 解析，不能是 gzip
        proxy_set_header Accept-Encoding "";
        proxy_pass http://gitlab;
    }

    # Glimpse 发布包：/glimpse-downloads/<版本>/<文件>，内容来自 GitLab 项目 kaguya/glimpse
    # （ID 150）的软件包仓库，每次 Release 的安装包都存在那里，主页的版本列表链到这里。
    # 项目是私有的：用只读部署令牌去取，令牌在 glimpse-deploy-token.inc 里，不会出现在网页上。
    # 只放行"版本号/Glimpse-*.zip"这一种路径。
    location ~ ^/glimpse-downloads/(?<glimpse_version>[0-9]+\.[0-9]+\.[0-9]+)/(?<glimpse_file>Glimpse-[A-Za-z0-9._-]+\.zip)$ {
        limit_except GET HEAD { deny all; }
        rewrite ^ /api/v4/projects/150/packages/generic/glimpse/$glimpse_version/$glimpse_file break;
        include /etc/nginx/conf.d/glimpse-deploy-token.inc;
        proxy_set_header Host git.yanlei.org;
        proxy_set_header X-Forwarded-Proto https;
        # 访客的 Cookie 和认证信息不转给 GitLab，GitLab 的 Cookie 也不回给访客
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        # 只有下载成功的包可以缓存（每个版本的文件不会变）；出错的回应不能让
        # Cloudflare 缓存，否则修好之前的 404/401 会挂上一整天。
        proxy_hide_header Cache-Control;
        add_header Cache-Control $glimpse_download_cache always;
        # 大文件边收边发
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://gitlab;
    }
